# Solana meme-coin paper-trading bot configuration.
# Every value here has a safe default in code; this file just makes them explicit.

mode: paper            # only "paper" is supported -- no live trading
log_level: INFO
trade_log_csv: trades.csv

strategy:
  buy_amount_sol: 0.05         # SOL spent per new-coin snipe
  take_profit_pct: 0.5         # exit at +50%
  stop_loss_pct: 0.3           # exit at -30%
  trailing_stop_pct: 0.25      # once in profit, exit if it falls 25% from the peak (0 = off)
  max_hold_seconds: 600        # force-exit after 10 minutes
  max_open_positions: 5        # cap simultaneous positions
  min_entry_price_sol: 0.0     # ignore launches priced below this (SOL/token)
  # max_entry_price_sol: leave unset for no upper bound

broker:
  starting_balance_sol: 1.0    # paper wallet size
  fee_pct: 0.01                # ~1% pump.fun-style fee per trade
  slippage_pct: 0.02           # simulated slippage on fills

feed:
  source: mock                 # "mock" (offline) or "pumpportal" (live pump.fun stream)
  pumpportal_url: wss://pumpportal.fun/api/data
  mock_new_token_interval_s: 2.0
  mock_tick_interval_s: 0.5
  mock_seed: 42                # set null for a different random market each run
